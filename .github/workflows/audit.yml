name: Dependency audit

# Full audit (dev dependencies, every severity). The pull request gate only checks
# production dependencies at high severity, so this catches the rest without blocking PRs.
on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit ${{ matrix.folder }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        folder: [web, api]
    defaults:
      run:
        working-directory: ${{ matrix.folder }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ matrix.folder }}/.nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.folder }}/package-lock.json

      - run: npm ci --ignore-scripts
      - run: npm audit
