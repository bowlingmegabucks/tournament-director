name: Deploy

# Verify, build, and deploy api/ to Azure App Service (OIDC sign-in), then
# verify, build web/ and upload web/dist/ to GreenGeeks over FTPS.
# main.yml calls it on each push to main.
# Run it by hand with dry_run on to build both without changing either server.
# See docs/deployment.md.
on:
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List the changes without uploading"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    environment: production
    # id-token lets the job ask GitHub for the OIDC token that Azure trusts.
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: api/.nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Ship only what runs: the build and production dependencies.
      - name: Stage package
        run: |
          mkdir ../api-package
          cp -r dist package.json package-lock.json ../api-package/
          npm ci --omit=dev --ignore-scripts --prefix ../api-package

      - name: Sign in to Azure
        if: ${{ inputs.dry_run != true }}
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        if: ${{ inputs.dry_run != true }}
        uses: Azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: ${{ vars.AZURE_WEB_APP_NAME }}
          package: api-package

  deploy-web:
    name: Deploy web
    # The API goes first, so the site never calls an API that is older than it expects.
    needs: deploy-api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    environment: production
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

      # The site calls the real API. Without a base URL it would call its own host and fail.
      - name: Check API_BASE_URL
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          case "$API_BASE_URL" in
            https://*) ;;
            *) echo "::error::API_BASE_URL must be set to the API origin, for example https://example.azurewebsites.net"; exit 1 ;;
          esac

      # API_BASE_URL is the API origin: no path, no trailing slash.
      # The site sits in a subfolder, so assets and router links need that prefix.
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          WEB_BASE_PATH: /tournament-director/

      - name: Check FTP_SERVER_DIR
        env:
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          case "$FTP_SERVER_DIR" in
            */) ;;
            *) echo "::error::FTP_SERVER_DIR must be set and end with '/' (for example public_html/)"; exit 1 ;;
          esac

      - name: Upload to GreenGeeks
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ vars.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: web/dist/
          server-dir: ${{ vars.FTP_SERVER_DIR }}
          dry-run: ${{ inputs.dry_run == true }}
