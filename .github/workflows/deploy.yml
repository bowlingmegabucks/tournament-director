name: Deploy

# Push to main: verify, build web/, upload web/dist/ to GreenGeeks over FTPS.
# Run it by hand with dry_run on to see what would upload without changing the server.
# See docs/deployment.md.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List the changes without uploading"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy-web:
    name: Deploy web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

      # Remove VITE_USE_MOCKS once the real API exists.
      - name: Build
        run: npm run build
        env:
          VITE_USE_MOCKS: "true"

      - name: Upload to GreenGeeks
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ vars.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: web/dist/
          server-dir: ${{ vars.FTP_SERVER_DIR }}
          dry-run: ${{ inputs.dry_run == true }}
