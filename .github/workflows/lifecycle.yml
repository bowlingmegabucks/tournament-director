name: Lifecycle test

# The whole-tournament test (docs/plans/lifecycle-e2e.md): a fresh database, the real API, and the
# production web build, driven through the UI. One definition for pull requests, main, and a manual
# run. Deploy does not wait for it.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    name: Tournament lifecycle
    runs-on: ubuntu-latest
    # Aim for 15 minutes; fail at 30.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            api/package-lock.json

      - run: npm ci --ignore-scripts
        working-directory: api
      # --ignore-scripts skips Prisma's own generate step, so run it here.
      - run: npm run db:generate
        working-directory: api
      - run: npm ci --ignore-scripts
        working-directory: web

      - name: Install Playwright browser
        run: ./node_modules/.bin/playwright install --with-deps chromium
        working-directory: web

      # Starts MariaDB and the mail catcher with Docker Compose, the API, and the web build, then
      # plays the tournament. The first admin comes from the app's script on a pseudo-terminal
      # (python3 is on the runner).
      - name: Run the lifecycle test
        run: npm run test:lifecycle
        working-directory: web
        env:
          CI: "true"

      - name: Upload the evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lifecycle-evidence
          path: |
            web/lifecycle-results
            web/lifecycle-report
          if-no-files-found: ignore
