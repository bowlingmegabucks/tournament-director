name: Main

# Push to main: scan with SonarCloud and deploy web/, in parallel.
# Add new main-branch work as another job here.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sonar:
    name: SonarCloud
    uses: ./.github/workflows/sonar.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    name: Deploy
    uses: ./.github/workflows/deploy.yml
    # The called workflow cannot ask for more than the caller grants: deploy-api needs id-token.
    permissions:
      contents: read
      id-token: write
    secrets: inherit
