name: Main

# Push to main: scan with SonarCloud, run mutation tests (reported to the Stryker Dashboard), and deploy, in parallel.
# Add new main-branch work as another job here.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sonar:
    name: SonarCloud
    uses: ./.github/workflows/sonar.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    name: Deploy
    uses: ./.github/workflows/deploy.yml
    # The called workflow cannot ask for more than the caller grants: deploy-api needs id-token.
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  # Pull requests run the same tests without reporting (see pull-request.yml).
  # Each folder sets its dashboard module in stryker.config.json, so the badges take ?module=web and ?module=api.
  mutation:
    name: ${{ matrix.folder }} mutation tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        folder: [web, api]
    defaults:
      run:
        working-directory: ${{ matrix.folder }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.folder }}/package-lock.json

      - run: npm ci --ignore-scripts
      - run: npm run test:mutation -- --reporters clear-text,html,dashboard
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.folder }}-mutation-report
          path: ${{ matrix.folder }}/reports/mutation
          if-no-files-found: ignore
