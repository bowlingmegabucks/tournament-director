name: Main

# Push to main: scan with SonarCloud, run mutation tests (reported to the Stryker Dashboard), and deploy, in parallel.
# Add new main-branch work as another job here.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sonar:
    name: SonarCloud
    uses: ./.github/workflows/sonar.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    name: Deploy
    uses: ./.github/workflows/deploy.yml
    # The called workflow cannot ask for more than the caller grants: deploy-api needs id-token.
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  # Pull requests run the same tests without reporting (see pull-request.yml).
  mutation:
    name: Mutation tests
    # The called workflow asks for pull-requests: write (the pull request comment).
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        folder: [web, api]
    uses: ./.github/workflows/mutation.yml
    with:
      folder: ${{ matrix.folder }}
      report: true
    secrets: inherit
