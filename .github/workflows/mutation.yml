name: Mutation tests

# One definition for pull requests and main. Main also reports to the Stryker Dashboard and mutates
# every file. A pull request mutates only the files it changed (see scripts/mutate.ts).
on:
  workflow_call:
    inputs:
      folder:
        description: web or api
        required: true
        type: string
      report:
        description: Send the result to the Stryker Dashboard
        required: false
        default: false
        type: boolean
      changed-only:
        description: Mutate only the source files this pull request changed
        required: false
        default: false
        type: boolean
    secrets:
      STRYKER_DASHBOARD_API_KEY:
        required: false

permissions:
  contents: read
  # A pull request run posts its result as a comment.
  pull-requests: write

jobs:
  mutation:
    name: ${{ inputs.folder }} mutation tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.folder }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request diff against its base branch needs the history.
          fetch-depth: ${{ inputs.changed-only && 0 || 1 }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.folder }}/.nvmrc
          cache: npm
          cache-dependency-path: ${{ inputs.folder }}/package-lock.json

      - run: npm ci --ignore-scripts

      # --ignore-scripts skips Prisma's own generate step, and only api has a Prisma schema.
      - name: Generate the Prisma client
        if: ${{ inputs.folder == 'api' }}
        run: npm run db:generate

      # Stryker's incremental mode reuses the results of the last run and tests again only the mutants
      # whose code, or whose covering tests, changed. The file is cached: a pull request starts from
      # the newest one (its own branch first, then main). The run that has none does a full run.
      # The score and the threshold still cover the whole project. The result is saved even when the
      # run fails the threshold, so a re-run of a pull request does not start from scratch.
      - name: Restore the incremental mutation result
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.folder }}/reports/stryker-incremental.json
          key: stryker-${{ inputs.folder }}-${{ github.run_id }}
          restore-keys: stryker-${{ inputs.folder }}-

      # A pull request mutates only what it changed. `main` runs everything and keeps the score for the
      # whole project. `none`: no source file changed (only tests or docs), so there is nothing to run.
      # `full`: a config or lock file changed, which can change every mutant.
      - name: Pick the files to mutate
        id: plan
        if: ${{ inputs.changed-only }}
        working-directory: .
        env:
          FOLDER: ${{ inputs.folder }}
          BASE: origin/${{ github.base_ref }}
        run: node scripts/mutateChanged.ts "$FOLDER" "$BASE" | tee -a "$GITHUB_OUTPUT"

      # Each folder sets its dashboard module in stryker.config.json (badges take ?module=web and ?module=api).
      # Without the key the dashboard reporter would fail after the full run, so skip it and warn.
      - name: Run mutation tests
        if: ${{ steps.plan.outputs.mode != 'none' }}
        env:
          MUTATE: ${{ steps.plan.outputs.mutate }}
          REPORT: ${{ inputs.report }}
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
        run: |
          reporters=clear-text,html,json
          if [ "$REPORT" = true ]; then
            if [ -n "$STRYKER_DASHBOARD_API_KEY" ]; then
              reporters="$reporters,dashboard"
            else
              echo "::warning::STRYKER_DASHBOARD_API_KEY is not set, so the result is not sent to the Stryker Dashboard."
            fi
          fi
          args=()
          if [ -n "$MUTATE" ]; then args=(--mutate "$MUTATE"); fi
          # The runner has 4 cores; Stryker's default leaves one idle.
          npm run test:mutation -- --incremental --concurrency "$(nproc)" --reporters "$reporters" "${args[@]}"

      - name: Save the incremental mutation result
        if: ${{ always() && hashFiles(format('{0}/reports/stryker-incremental.json', inputs.folder)) != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.folder }}/reports/stryker-incremental.json
          key: stryker-${{ inputs.folder }}-${{ github.run_id }}

      # One comment per folder, updated on each push. The step summary shows it for forks too, whose
      # token cannot write comments.
      - name: Post the result on the pull request
        if: ${{ always() && inputs.changed-only }}
        working-directory: .
        env:
          FOLDER: ${{ inputs.folder }}
          MODE: ${{ steps.plan.outputs.mode }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          report="$FOLDER/reports/mutation/mutation.json"
          if [ "$MODE" = none ]; then
            body="<!-- mutation-$FOLDER -->"$'\n'"### Mutation tests ($FOLDER)"$'\n\n'"No source file changed, so no mutants ran."
          elif [ -f "$report" ]; then
            body=$(node scripts/mutationSummary.ts "$FOLDER" "$report" "$RUN_URL" changed)
          else
            exit 0
          fi
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SAME_REPO" != true ]; then exit 0; fi
          marker="<!-- mutation-$FOLDER -->"
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.folder }}-mutation-report
          path: ${{ inputs.folder }}/reports/mutation
          if-no-files-found: ignore
