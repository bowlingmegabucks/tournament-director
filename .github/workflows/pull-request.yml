name: Pull request

on:
  pull_request:
    branches: [main]

concurrency:
  group: pull-request-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      # Full history: the check reads main's version and the release tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: api/.nvmrc

      # In 0.x a missing bump is a warning on the pull request. A released version, a mismatch
      # between api and web, or a version below main fails the job. From 1.0.0 a missing bump fails too.
      - run: npm ci --ignore-scripts
      - run: npm run format:scripts:check
      - run: npm run test:scripts
      - run: npm run check:version -- --base origin/main

  web-verify:
    name: Web lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          VITE_USE_MOCKS: "true"

      - name: Install Playwright browser
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-playwright-traces
          path: web/test-results
          if-no-files-found: ignore

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-coverage
          path: web/coverage
          if-no-files-found: ignore

  sonar:
    name: SonarCloud
    uses: ./.github/workflows/sonar.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  mutation:
    name: Mutation tests
    # The called workflow asks for pull-requests: write (the pull request comment).
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        folder: [web, api]
    uses: ./.github/workflows/mutation.yml
    with:
      folder: ${{ matrix.folder }}
      changed-only: true

  api-verify:
    name: API lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: api/.nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci --ignore-scripts
      # --ignore-scripts skips Prisma's own generate step, so run it here.
      - run: npm run db:generate
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

      # Starts the built app the way Azure does, so a bad --import path or a broken telemetry start
      # fails here, not after deploy. The connection string turns the SDK and Azure exporters on;
      # its endpoint refuses connections, so nothing leaves the runner. Then SIGTERM must exit 0.
      # DATABASE_URL is required at start but the database connects on first query, and /health
      # does not query, so a URL with no server behind it is enough.
      - name: Smoke test the build
        env:
          PORT: "3999"
          DATABASE_URL: "mariadb://smoke:smoke@127.0.0.1:1/smoke"
          APPLICATIONINSIGHTS_CONNECTION_STRING: "InstrumentationKey=00000000-0000-0000-0000-000000000000;IngestionEndpoint=https://127.0.0.1:1/"
        run: |
          node --import ./dist/instrumentation.js dist/server.js > server.log 2>&1 &
          server=$!
          healthy=false
          for _ in $(seq 1 20); do
            if curl -fsS http://localhost:3999/health; then healthy=true; break; fi
            sleep 0.5
          done
          kill -TERM "$server" || true
          status=0
          wait "$server" || status=$?
          cat server.log
          [ "$healthy" = true ] && [ "$status" = 0 ]

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-coverage
          path: api/coverage
          if-no-files-found: ignore
