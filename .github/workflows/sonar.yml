name: SonarCloud

# Reusable. Called by pull-request.yml and sonar-main.yml.
# Runs the tests with coverage, then sends the code and the lcov report to SonarCloud.
on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  analyze:
    name: Build and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Shallow clones hurt the relevance of the analysis

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            api/package-lock.json

      - name: Test scripts with coverage
        run: npm run test:scripts:coverage

      - name: Test web with coverage
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run test:coverage -- --coverage.reporter=lcov

      - name: Test api with coverage
        working-directory: api
        run: |
          npm ci --ignore-scripts
          npm run db:generate
          npm run test:coverage -- --coverage.reporter=lcov

      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=bowlingmegabucks
            -Dsonar.projectKey=bowlingmegabucks_tournament-director
            -Dsonar.exclusions=web/public/mockServiceWorker.js
            -Dsonar.coverage.exclusions=web/e2e/**,web/**/*.test.ts,web/**/*.test.tsx,web/*.config.*,web/src/main.tsx,web/src/mocks/**,web/src/test/**,web/src/**/*.d.ts,api/**/*.test.ts,api/*.config.*,api/src/server.ts,api/src/test/**,scripts/*.test.ts,scripts/checkVersion.ts
            -Dsonar.javascript.lcov.reportPaths=web/coverage/lcov.info,api/coverage/lcov.info,scripts/coverage/lcov.info
