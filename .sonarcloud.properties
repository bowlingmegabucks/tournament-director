# Read by SonarCloud Automatic Analysis. Paths are relative to the repo root.
# Generated by `npx msw init`. Not our code.
sonar.exclusions=web/public/mockServiceWorker.js

# Test code repeats on purpose: each test reads alone, and the factories in api/ and web/ mirror each
# other because the two packages share no code. These are the test files, mocks, and test helpers.
sonar.cpd.exclusions=web/**/*.test.ts,web/**/*.test.tsx,web/e2e/**,web/src/mocks/**,web/src/test/**,api/**/*.test.ts,api/src/test/**,scripts/*.test.ts
