# Local services. `npm run services:up` starts them.
# Host ports are non-standard (15xxx) so a global Seq or database can keep the defaults.
name: tournament-director

services:
  seq:
    container_name: tournament-director-seq
    image: datalust/seq:2026.1
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      # Local only: no login. Do not copy this setting to a shared host.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      # Web UI: http://localhost:15380
      - "15380:80"
      # OTLP and Seq ingestion: http://localhost:15341/ingest/otlp (logs, traces, metrics)
      - "15341:5341"
    volumes:
      - seq-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/api"]
      interval: 10s
      timeout: 3s
      retries: 5

  database:
    container_name: tournament-director-db
    # The version the legacy repo pins (D-34). Check production with SELECT VERSION().
    image: mariadb:11.4.7
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: bowling_megabucks
      MARIADB_USER: megabucks
      # Local only. api/.env.example holds the matching DATABASE_URL.
      MARIADB_PASSWORD: bowling4money
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      # mariadb://megabucks:bowling4money@localhost:15306/bowling_megabucks
      - "15306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  mail:
    container_name: tournament-director-mail
    # Mailpit catches every email the API sends, so local runs mail no one. It plays the part of
    # the .NET MailKit/smtp4dev tools: a fake SMTP server with an inbox in the browser.
    image: axllent/mailpit:v1.32
    restart: unless-stopped
    environment:
      # Local only. STARTTLS is required with a self-signed certificate, like a real mail host, so
      # the API's mailer runs the same way. api/.env.example sets SMTP_ALLOW_SELF_SIGNED to match.
      MP_SMTP_TLS_CERT: "sans:localhost"
      MP_SMTP_TLS_KEY: "sans:localhost"
      MP_SMTP_REQUIRE_STARTTLS: "true"
      # Any login works.
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
    ports:
      # Inbox: http://localhost:15325
      - "15325:8025"
      # SMTP: localhost:15025
      - "15025:1025"

volumes:
  seq-data:
    name: tournament-director-seq-data
  db-data:
    name: tournament-director-db-data
