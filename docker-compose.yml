# Local services. `npm run services:up` starts them.
# Host ports are non-standard (15xxx) so a global Seq or database can keep the defaults.
name: tournament-director

services:
  seq:
    container_name: tournament-director-seq
    image: datalust/seq:2026.1
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      # Local only: no login. Do not copy this setting to a shared host.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      # Web UI: http://localhost:15380
      - "15380:80"
      # OTLP and Seq ingestion: http://localhost:15341/ingest/otlp (logs, traces, metrics)
      - "15341:5341"
    volumes:
      - seq-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/api"]
      interval: 10s
      timeout: 3s
      retries: 5

  database:
    container_name: tournament-director-db
    # The version the legacy repo pins (D-34). Check production with SELECT VERSION().
    image: mariadb:11.4.7
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: bowling_megabucks
      MARIADB_USER: megabucks
      # Local only. api/.env.example holds the matching DATABASE_URL.
      MARIADB_PASSWORD: bowling4money
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      # mariadb://megabucks:bowling4money@localhost:15306/bowling_megabucks
      - "15306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  seq-data:
    name: tournament-director-seq-data
  db-data:
    name: tournament-director-db-data
