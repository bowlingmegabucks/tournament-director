<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The page follows the system theme until the user picks a light or dark theme. -->
    <meta name="color-scheme" content="light dark" />
    <!-- Apply a saved light or dark choice before the page paints. Same key as src/shared/theme.ts. -->
    <script>
      try {
        var savedTheme = localStorage.getItem('tournament-director-theme')
        if (savedTheme === 'light' || savedTheme === 'dark') {
          document.documentElement.dataset.theme = savedTheme
        }
      } catch (error) {
        // Storage can be blocked. The page then follows the system theme.
      }
    </script>
    <title>Tournament Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
